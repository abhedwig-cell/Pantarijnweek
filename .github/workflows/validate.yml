name: Validate planning data

on:
  push:
    branches: ["main", "work/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate normalized data
        run: python scripts/validate_data.py
