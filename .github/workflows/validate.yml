name: Validate planning data

on:
  push:
    branches: ["main", "work/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate normalized data
        run: python scripts/validate_data.py
      - name: Build dashboard signals
        run: python scripts/build_dashboard_signals.py --output /tmp/dashboard_signals.json
      - name: Verify dashboard signal contract
        run: |
          python - <<'PY'
          import json
          p = json.load(open("/tmp/dashboard_signals.json", encoding="utf-8"))
          assert p["edition"] == "2026"
          assert isinstance(p["signals"], list)
          assert all(s["severity"] in {"info","ok","warning","critical","unknown"} for s in p["signals"])
          assert all(s["rule_id"] and s["scope_type"] for s in p["signals"])
          print(f"dashboard signals OK: {len(p['signals'])}")
          PY
      - name: Build deterministic dashboard demo
        run: |
          python scripts/build_dashboard_demo_signals.py --output /tmp/dashboard_demo_signals.json
          python scripts/build_dashboard.py --input /tmp/dashboard_demo_signals.json --output dashboard/public
      - name: Verify dashboard rendering and capacity transition
        run: |
          test -f dashboard/public/index.html
          grep -q "Maandag ochtend · OB" dashboard/public/index.html
          grep -q "marge -9" dashboard/public/index.html
          grep -q "Kritiek" dashboard/public/index.html
          grep -q "Gewijzigd na Magisterinvoer" dashboard/public/index.html
