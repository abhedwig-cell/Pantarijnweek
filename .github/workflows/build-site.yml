name: Build generated website

on:
  push:
    branches: ["main", "work/**"]
    paths:
      - "data/2026/**"
      - "site/**"
      - "scripts/build_website.py"
      - ".github/workflows/build-site.yml"
  pull_request:
    paths:
      - "data/2026/**"
      - "site/**"
      - "scripts/build_website.py"

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build demonstration website
        run: python scripts/build_website.py --demo
      - name: Verify expected pages and v3 interactions
        run: |
          test -f site/public/index.html
          test -f site/public/programma.html
          test -f site/public/doelgroepen.html
          test -f site/public/ma-ochtend.html
          test -f site/public/mijn-pantarijnweek.html
          grep -q "Bekijk het programma" site/public/index.html
          grep -q "data-detail" site/public/ma-ochtend.html
          grep -q "data-audience-filter" site/public/ma-ochtend.html
          grep -q "Mijn week" site/public/mijn-pantarijnweek.html
      - uses: actions/upload-artifact@v4
        with:
          name: generated-pantarijnweek-site
          path: site/public
